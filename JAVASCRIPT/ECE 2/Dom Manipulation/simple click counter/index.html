<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Click Counter</title>
<style>
/* ===== Page Styling ===== */
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f4f4f4;
    padding:40px;
}
/* Counter display box */
#count-display{
    font-size:24px;
    font-weight:bold;
    margin:20px;
}
/* Button styling */
button{
    padding:10px 18px;
    border:none;
    background:#007bff;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#0056b3;
}
</style>
</head>
<body>
<h2>Simple Click Counter</h2>
<!-- Display area where click count will appear -->
<div id="count-display">
Clicks: 0
</div>
<!-- Button user will click -->
<button id="count-btn">
Click Me
</button>
<script>
/* ============================
   Step 1: Create a counter variable
   ============================ */
// This variable stores the number of clicks
let count = 0;

/* ============================
   Step 2: Select DOM elements
   ============================ */
// Select the button
const countBtn = document.querySelector("#count-btn");
// Select the display area
const countDisplay = document.querySelector("#count-display");

/* ============================
   Step 3: Add click event
   ============================ */
countBtn.addEventListener('click', function() {
    /* Increase count value by 1 */
    count++;
    /* Update the display text */
    countDisplay.textContent = "Clicks: " + count;
});
</script>
</body>
</html><title>Simple Click Counter</title>

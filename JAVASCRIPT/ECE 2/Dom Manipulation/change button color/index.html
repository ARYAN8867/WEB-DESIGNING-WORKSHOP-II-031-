<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Color Button</title>
<style>
/* ===== Page Styling ===== */
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f4f4f4;
    padding:40px;
}
/* ===== Color Box ===== */
#color-box{
    width:250px;
    height:150px;
    background:lightgray;
    margin:20px auto;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}
/* ===== Button Styling ===== */
button{
    padding:10px 18px;
    border:none;
    background:#007bff;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#0056b3;
}
</style>
</head>
<body>
<h2>Random Color Changer</h2>
<!-- Box whose color will change -->
<div id="color-box">
Click the button
</div>
<!-- Button to trigger color change -->
<button id="color-btn">Change Color</button>

<script>
/* ==============================
   Step 1: Select elements
   ============================== */
// Select the button
const colorBtn = document.querySelector("#color-btn");
// Select the box whose color will change
const box = document.querySelector("#color-box");

/* ==============================
   Step 2: Add click event
   ============================== */
colorBtn.addEventListener('click', function() {

    /* Array of colors */
    const colors = ['tomato', 'steelblue', 'goldenrod', 'seagreen'];

    /* Generate random number
       Math.random() → random value between 0 and 1
       Multiply by array length
       Math.floor() removes decimal */
    const random = Math.floor(Math.random() * colors.length);

    /* Change box background color */
    box.style.backgroundColor = colors[random];
});
</script>
</body>
</html>
